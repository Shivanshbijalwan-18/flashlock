spring.application.name=flashlock-backend
server.port=${PORT:8080}

spring.datasource.url=${FLASHLOCK_DB_URL:jdbc:postgresql://localhost:5432/flashlock_db}
spring.datasource.username=${FLASHLOCK_DB_USERNAME:}
spring.datasource.password=${FLASHLOCK_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.jackson.serialization.write-dates-as-timestamps=false
